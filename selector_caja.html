<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VINOPOLY CLUB — Arma tu Caja</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#f8f7f4;color:#1a1a1a;min-height:100vh}

/* HEADER */
.header{background:#fff;border-bottom:3px solid #931123;padding:0 16px;position:sticky;top:0;z-index:100}
.header-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px}
.header-logo{display:flex;align-items:center;gap:10px}
.header-logo span{font-weight:700;font-size:16px;color:#931123;letter-spacing:0.05em}
.header-sub{font-size:10px;color:#999;letter-spacing:0.15em}

/* PROGRESS BAR */
.progress-bar{background:#fff;border-bottom:1px solid #eee;padding:12px 16px}
.progress-inner{max-width:680px;margin:0 auto}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#999;margin-bottom:8px}
.progress-label span{font-weight:600;color:#931123}
.progress-track{height:6px;background:#eee;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#931123;border-radius:3px;transition:width 0.4s ease}

/* CAJA PREVIEW */
.box-preview{background:#fff;border-bottom:1px solid #eee;padding:16px}
.box-preview-inner{max-width:680px;margin:0 auto}
.box-title{font-size:11px;letter-spacing:0.2em;color:#999;margin-bottom:12px}
.box-slots{display:flex;gap:8px;justify-content:center}
.slot{width:80px;height:110px;border:2px dashed #ddd;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;background:#fafafa;transition:all 0.2s;flex-shrink:0}
.slot.filled{border-color:#931123;border-style:solid;background:#fff}
.slot img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.slot .slot-empty{font-size:24px;color:#ddd}
.slot .remove-btn{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#931123;color:#fff;border:none;cursor:pointer;font-size:14px;line-height:22px;text-align:center;display:none}
.slot.filled .remove-btn{display:block}

/* FILTROS */
.filters{background:#fff;border-bottom:1px solid #eee;padding:10px 16px}
.filters-inner{max-width:680px;margin:0 auto;display:flex;gap:8px}
.filter-btn{padding:7px 18px;border-radius:20px;border:1.5px solid #ddd;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:#666;font-family:inherit;transition:all 0.2s}
.filter-btn.active{background:#931123;color:#fff;border-color:#931123}

/* WINE LIST */
.wine-list{max-width:680px;margin:0 auto;padding:12px 16px 120px}
.wine-card{background:#fff;border-radius:12px;border:1.5px solid #eee;margin-bottom:10px;display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;transition:all 0.2s;position:relative}
.wine-card:active{transform:scale(0.98)}
.wine-card.selected{border-color:#931123;background:#fff9f9}
.wine-card.disabled{opacity:0.4;cursor:not-allowed}
.wine-thumb{width:52px;height:80px;object-fit:contain;flex-shrink:0}
.wine-info{flex:1;min-width:0}
.wine-type{font-size:9px;letter-spacing:0.2em;font-weight:600;margin-bottom:2px}
.wine-type.tinto{color:#931123}
.wine-type.blanco{color:#8B6914}
.wine-type.champagne{color:#2A1A5C}
.wine-name{font-size:14px;font-weight:600;color:#1a1a1a;line-height:1.3;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wine-vintage{font-size:11px;color:#999}
.wine-price{font-size:15px;font-weight:700;color:#931123;flex-shrink:0}
.check-icon{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#931123;color:#fff;display:none;align-items:center;justify-content:center;font-size:13px}
.wine-card.selected .check-icon{display:flex}

/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:12px 16px;z-index:100}
.bottom-inner{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.total-info{flex:1}
.total-bottles{font-size:12px;color:#999}
.total-price{font-size:18px;font-weight:700;color:#931123}
.btn-review{padding:12px 24px;background:#931123;color:#fff;border:none;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity 0.2s}
.btn-review:disabled{opacity:0.4;cursor:not-allowed}
.btn-review:not(:disabled):hover{opacity:0.9}

/* MODAL REVISIÓN */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:24px 20px 32px}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:4px;text-align:center}
.modal-sub{font-size:12px;color:#999;text-align:center;margin-bottom:20px}
.modal-items{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.modal-item{display:flex;align-items:center;gap:12px;padding:10px;background:#f8f7f4;border-radius:10px}
.modal-item img{width:40px;height:60px;object-fit:contain}
.modal-item-info{flex:1}
.modal-item-name{font-size:13px;font-weight:600;color:#1a1a1a}
.modal-item-vintage{font-size:11px;color:#999}
.modal-item-price{font-size:14px;font-weight:700;color:#931123}
.modal-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1.5px solid #eee;margin-bottom:16px}
.modal-total-label{font-size:13px;color:#999}
.modal-total-val{font-size:22px;font-weight:700;color:#931123}
.btn-wa{width:100%;padding:16px;background:#25D366;border:none;border-radius:24px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.btn-back{width:100%;padding:12px;background:#fff;border:1.5px solid #ddd;border-radius:24px;color:#666;font-size:13px;cursor:pointer;font-family:inherit}

/* Logo img */
.logo-img{width:36px;height:36px;object-fit:contain}
</style>
</head>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">

    <button class="btn-wa" onclick="sendOrder()">📲 Enviar pedido por WhatsApp</button>
    <button class="btn-back" onclick="closeModal()">← Seguir eligiendo</button>

</div>

let selected = []; // array of wine ids, max 6
let currentFilter = 'all';

function getWine(id) { return WINES.find(w => w.id === id); }

function toggleWine(id) {
  const idx = selected.indexOf(id);
  if (idx >= 0) {
    selected.splice(idx, 1);
  } else {
    if (selected.length >= 6) return;
    selected.push(id);
  }
  updateUI();
}

function removeSlot(id) {
  selected = selected.filter(x => x !== id);
  updateUI();
}

function updateUI() {
  const n = selected.length;

  // Progress
  document.getElementById('prog-count').textContent = n + ' de 6 vinos seleccionados';
  document.getElementById('prog-pct').textContent = Math.round(n/6*100) + '%';
  document.getElementById('prog-fill').style.width = (n/6*100) + '%';

  // Box slots
  for (let i = 0; i < 6; i++) {
    const slot = document.getElementById('slot-' + i);
    const wid = selected[i];
    if (wid) {
      const thumb = THUMBS[wid] || '';
      slot.className = 'slot filled';
      slot.innerHTML = '<img src="' + thumb + '" alt=""><button class="remove-btn" onclick="event.stopPropagation();removeSlot(' + wid + ')">×</button>';
    } else {
      slot.className = 'slot';
      slot.innerHTML = '<span class="slot-empty">+</span>';
    }
  }

  // Total
  const total = selected.reduce((s, id) => { const w = getWine(id); return s + (w ? w.pvp : 0); }, 0);
  document.getElementById('tot-bottles').textContent = n + ' botella' + (n !== 1 ? 's' : '');
  document.getElementById('tot-price').textContent = '$' + total.toLocaleString('es-VE');
  document.getElementById('btn-review').disabled = n < 6;

  // Wine cards
  document.querySelectorAll('.wine-card').forEach(card => {
    const id = parseInt(card.dataset.id);
    const isSelected = selected.includes(id);
    const isFull = selected.length >= 6 && !isSelected;
    card.className = 'wine-card' + (isSelected ? ' selected' : '') + (isFull ? ' disabled' : '');
  });
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const list = document.getElementById('wine-list');
  const filtered = currentFilter === 'all' ? WINES : WINES.filter(w => w.type === currentFilter);
  list.innerHTML = filtered.map(w => {
    const isSelected = selected.includes(w.id);
    const isFull = selected.length >= 6 && !isSelected;
    const thumb = THUMBS[w.id] || '';
    return '<div class="wine-card' + (isSelected ? ' selected' : '') + (isFull ? ' disabled' : '') + '" data-id="' + w.id + '" onclick="toggleWine(' + w.id + ')">'
      + '<img class="wine-thumb" src="' + thumb + '" alt="">'
      + '<div class="wine-info">'
      + '<div class="wine-type ' + w.type + '">' + w.type.toUpperCase() + '</div>'
      + '<div class="wine-name">' + w.name + '</div>'
      + '<div class="wine-vintage">' + w.vintage + '  ·  ' + w.appellation + '</div>'
      + '</div>'
      + '<div class="wine-price">$' + w.pvp + '</div>'
      + '<div class="check-icon">✓</div>'
      + '</div>';
  }).join('');
}

function openModal() {
  const items = selected.map(id => {
    const w = getWine(id);
    const thumb = THUMBS[id] || '';
    return '<div class="modal-item"><img src="' + thumb + '" alt=""><div class="modal-item-info"><div class="modal-item-name">' + w.name + '</div><div class="modal-item-vintage">' + w.vintage + ' · ' + w.appellation + '</div></div><div class="modal-item-price">$' + w.pvp + '</div></div>';
  }).join('');
  document.getElementById('modal-items').innerHTML = items;
  const total = selected.reduce((s, id) => { const w = getWine(id); return s + (w ? w.pvp : 0); }, 0);
  document.getElementById('modal-total').textContent = '$' + total.toLocaleString('es-VE');
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function sendOrder() {
  const lines = ['🍷 *VINOPOLY CLUB — Mi Caja de 6 Vinos*', ''];
  let total = 0;
  selected.forEach(id => {
    const w = getWine(id);
    if (w) { lines.push('1 ' + w.name + ' ' + w.vintage + ' · $' + w.pvp); total += w.pvp; }
  });
  lines.push('', '──────────────────');
  lines.push('🧾 *Total: 6 botellas — $' + total.toLocaleString('es-VE') + '*');
  lines.push('', '💳 Zelle: pbrillembourg@gmail.com');
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(lines.join('\n')), '_blank');
}

// Init
renderList();
updateUI();
// Check if coming from ruleta with a pre-selected wine
(function(){
  const params = new URLSearchParams(window.location.search);
  const addId = parseInt(params.get('add'));
  if(addId && !isNaN(addId) && selected.length < 6 && !selected.includes(addId)){
    selected.push(addId);
    updateUI();
  }
})();
</script>
