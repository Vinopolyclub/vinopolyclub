<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VINOPOLY — Estilo Japonés</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@300;400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f0e6;font-family:'Noto Serif JP',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:40px;position:relative;overflow-x:hidden}

      body::before{content:'';position:fixed;inset:0;background:
        repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(180,60,40,0.04) 40px,rgba(180,60,40,0.04) 41px),
        repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(180,60,40,0.04) 40px,rgba(180,60,40,0.04) 41px);
        pointer-events:none;z-index:0}
.header{width:100%;padding:20px 24px 14px;text-align:center;border-bottom:1px solid rgba(180,60,40,0.15);position:relative;z-index:1}
.header-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.header-logo img{width:44px;height:44px;object-fit:contain;filter:sepia(0.3)}
.logo-text{color:#8b1a1a;letter-spacing:0.2em;font-size:1.2rem;font-weight:700}
.header-sub{font-size:11px;letter-spacing:0.25em;color:rgba(139,26,26,0.5);font-style:normal}
.stats{display:flex;gap:32px;margin:16px auto 0;position:relative;z-index:1}
.stat{text-align:center}
.stat-n{font-size:20px;font-weight:700;color:#2a1a0a}
.stat-l{font-size:9px;letter-spacing:0.2em;color:rgba(42,26,10,0.4)}
.ruleta-wrap{position:relative;width:340px;height:340px;margin:20px auto 0;z-index:1}
#ruleta{width:340px;height:340px;border-radius:50%;box-shadow:0 0 0 6px #8b1a1a,0 0 0 8px #2a1a0a}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#8b1a1a,#5a0e0e);border:3px solid #f5f0e6;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:10;font-family:'Noto Serif JP',serif}
#btn-spin{margin:22px auto 0;display:block;padding:14px 56px;background:#8b1a1a;border:none;border-radius:4px;color:#f5f0e6;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:0.3em;font-family:'Noto Serif JP',serif;transition:all 0.2s;position:relative;z-index:1}
#btn-spin:hover{transform:translateY(-2px);opacity:0.9}
#btn-spin:disabled{opacity:0.4;cursor:not-allowed;transform:none}
#winner-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:100;align-items:flex-end;justify-content:center}
#winner-modal.open{display:flex}
.winner-panel{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px 32px;animation:slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.winner-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 18px}
.winner-type{font-size:10px;letter-spacing:0.2em;font-weight:700;margin-bottom:6px}
.winner-type.tinto{color:#931123}.winner-type.blanco{color:#8B6914}.winner-type.champagne{color:#2A1A5C}
.winner-name{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:4px;line-height:1.3}
.winner-app{font-size:13px;color:#888;margin-bottom:12px}
.winner-divider{height:1px;background:#eee;margin:10px 0}
.winner-price{font-size:28px;font-weight:700;color:#931123}
.winner-tasting{font-size:12px;color:#555;line-height:1.7;font-style:italic;margin:10px 0 14px}
.btn-wa{width:100%;padding:14px;background:#25D366;border:none;border-radius:24px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.btn-close{width:100%;padding:10px;background:#fff;border:1.5px solid #ddd;border-radius:24px;color:#666;font-size:13px;cursor:pointer;font-family:inherit}
</style>
</head>

n suelos de Silex. Cultivadas sin herbicidas, insecticidas ni fertilizantes. Oro pálido brillante. Nariz intensamente cristalina con frutos blancos, cítricos y la firma mineralidad de pedernal. Ataque amplio y redondo con energía vibrante y un final muy salino. Criado 8–12 meses en foudres de 2.000 litros.", "score": {"critic": "Ecológico", "pts": "FR-BIO-01"}, "food": ["Ostras", "Lubina a la Plancha", "Queso de Cabra", "Sushi"], "ageing": "8–12 meses en foudres grandes de roble", "alcohol": "13%", "type": "VINO BLANCO"}, {"id": 48, "name": "Domaine Joseph Mellot · La Gravelière", "vintage": "2024", "appellation": "Sancerre AOC · Loira", "region": "loira", "pvp": 48.0, "grapes": ["100% Sauvignon Blanc"], "tasting": "Sancerre de La Gravelière, una de las parcelas emblema de Joseph Mellot en suelos de gravas y pedernal. Nariz intensa y cristalina de cítricos, pamplemousse y flores blancas con la mineralidad típica del silex. Paladar fresco, tenso y sabroso con larga persistencia salina. Añada 2024 de excepcional expresión. El Sancerre es el Sauvignon Blanc de referencia mundial, y Joseph Mellot es uno de sus grandes embajadores.", "score": {"critic": "Loire", "pts": "Est. 92"}, "food": ["Queso de Cabra Fresco", "Ostras Finas", "Lubina a la Sal", "Sushi"], "ageing": "Acero inoxidable", "alcohol": "13%", "type": "VINO BLANCO"}, {"id": 49, "name": "Domaine Pommier · Chablis", "vintage": "2022", "appellation": "Chablis AOC · Borgoña", "region": "bourgogne", "pvp": 49.0, "grapes": ["100% Chardonnay"], "tasting": "Del Domaine Isabelle et Denis Pommier en el corazón de Chablis, la expresión más pura del Chardonnay sobre suelos de kimmeridgiense — la misma piedra caliza que da su famosa mineralidad a los vinos de Chablis. Color dorado pálido con reflejos verdes. Aromas de manzana verde, limón, flores blancas y la icónica nota de ostras y pedernal. Fresco, mineral y tensionado. Un Chablis de gran autenticidad y personalidad.", "score": {"critic": "Chablis", "pts": "AOC"}, "food": ["Ostras de Marennes", "Frutos del Mar", "Pescados Blancos", "Queso de Cabra"], "ageing": "Acero inoxidable", "alcohol": "12.5%", "type": "VINO BLANCO"}, {"id": 44, "name": "Champagne Picard & Boyer · Esprit de Famille", "vintage": "NV", "appellation": "Champagne · Brut · Récoltant-Manipulant", "region": "champagne", "pvp": 53.0, "grapes": ["Chardonnay", "Pinot Noir", "Pinot Meunier"], "tasting": "La cuvée Esprit de Famille de esta maison familiar encarna el espíritu artesanal de los pequeños productores de Champagne. Burbuja fina y persistente, aromas de brioche, frutos blancos y flores. Paladar fresco y perfectamente equilibrado con acidez vivaz y un final limpio y gratificante. Champagne de productor independiente con carácter auténtico y artesanal.", "score": {"critic": "RM", "pts": "Indépendant"}, "food": ["Aperitivo", "Ostras", "Canapés", "Quesos Suaves"], "ageing": "Crianza tradicional sobre lías", "alcohol": "12%", "type": "CHAMPAGNE"}];

const N=WINES.length,canvas=document.getElementById('ruleta'),ctx=canvas.getContext('2d');
const CX=170,CY=170,R=164;
let angle=0,spinning=false,spins=0,ballAngle=-Math.PI/2,ballR=R*0.93,ballLanded=false;
const R_TOP=R*0.88,R_BOT=R*0.60;
const SEG_A='#f5f0e6',SEG_B='#d4504a';
const RING_COL='#2a1a0a',FRAME_COL='#8b1a1a';
const STROKE_COL='rgba(139,26,26,0.2)';
const DOT_COL='#8b1a1a';

function draw(a){
  ctx.clearRect(0,0,340,340);
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle="#f5f0e6";ctx.fill();
  const seg=(Math.PI*2)/N;
  WINES.forEach((w,i)=>{
    const isA=(i%2===0),s=a+i*seg,e=s+seg;
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,R,s,e);ctx.closePath();
    ctx.fillStyle=isA?SEG_A:SEG_B;ctx.fill();
    ctx.strokeStyle=STROKE_COL;ctx.lineWidth=0.8;ctx.stroke();
    const img=isA?IA_japones[w.id]:IB_japones[w.id];
    if(img&&img.complete&&img.naturalWidth>0){
      const mid=s+seg/2;
      const ix=CX+(R*0.74)*Math.cos(mid),iy=CY+(R*0.74)*Math.sin(mid);
      ctx.save();ctx.translate(ix,iy);ctx.rotate(mid+Math.PI/2);
      ctx.drawImage(img,-11,-20,22,40);ctx.restore();
    }
  });
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle=RING_COL;ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,R_TOP,0,Math.PI*2);
  ctx.strokeStyle=FRAME_COL;ctx.lineWidth=1.2;ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,R_BOT,0,Math.PI*2);
  ctx.strokeStyle=FRAME_COL;ctx.lineWidth=1.2;ctx.stroke();
  const sf=(Math.PI*2)/N;
  for(let i=0;i<N;i++){
    const a2=a+i*sf;
    ctx.beginPath();
    ctx.moveTo(CX+R_BOT*Math.cos(a2),CY+R_BOT*Math.sin(a2));
    ctx.lineTo(CX+R_TOP*Math.cos(a2),CY+R_TOP*Math.sin(a2));
    ctx.strokeStyle=FRAME_COL;ctx.lineWidth=0.8;ctx.stroke();
  }
  for(let i=0;i<N;i++){
    const a2=a+i*(Math.PI*2/N);
    ctx.beginPath();ctx.arc(CX+(R-2)*Math.cos(a2),CY+(R-2)*Math.sin(a2),3,0,Math.PI*2);
    ctx.fillStyle=DOT_COL;ctx.fill();
  }
}
function drawBall(bA,bR){
  const bx=CX+bR*Math.cos(bA),by=CY+bR*Math.sin(bA);
  ctx.beginPath();ctx.arc(bx,by,9,0,Math.PI*2);ctx.fillStyle='rgba(255,220,0,0.25)';ctx.fill();
  ctx.beginPath();ctx.arc(bx+1.5,by+1.5,6,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();
  ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.fillStyle='#ffd700';ctx.fill();
  ctx.beginPath();ctx.arc(bx-2,by-2,2.5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,200,0.9)';ctx.fill();
  ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.strokeStyle='rgba(180,140,0,0.8)';ctx.lineWidth=1;ctx.stroke();
}
[...Object.values(IA_japones),...Object.values(IB_japones)].forEach(img=>{img.onload=()=>{draw(angle);if(ballLanded)drawBall(ballAngle,ballR);}});
draw(angle);
function spin(){
  if(spinning)return;spinning=true;ballLanded=false;ballAngle=-Math.PI/2;ballR=R*0.93;
  document.getElementById('btn-spin').disabled=true;document.getElementById('btn-spin').textContent='...';
  const wT=(5+Math.random()*4)*Math.PI*2,bT=(10+Math.random()*6)*Math.PI*2;
  const sD=4000+Math.random()*1000,fD=1200,t0=performance.now(),a0=angle,ba0=ballAngle;
  const RL=R*0.74,ws=Math.floor(Math.random()*N),sg=(Math.PI*2)/N;
  let ph='spin';
  function eO(t){return 1-Math.pow(1-t,4);}
  function eF(t){return 1-Math.pow(1-t,2);}
  function frame(now){
    const el=now-t0;
    if(ph==='spin'){
      const t=Math.min(el/sD,1),e=eO(t);
      angle=a0+wT*e;ballAngle=ba0-bT*e;ballR=R*0.93;
      draw(angle);drawBall(ballAngle,ballR);
      if(t<1){requestAnimationFrame(frame);}else{ph='fall';requestAnimationFrame(frame);}
    }else{
      const t=Math.min((el-sD)/fD,1),e=eF(t);
      ballR=R*0.93-(R*0.93-RL)*e;
      const wc=angle+ws*sg+sg/2;ballAngle=ballAngle+(wc-ballAngle)*e*0.5;
      draw(angle);drawBall(ballAngle,ballR);
      if(t<1){requestAnimationFrame(frame);}else{
        spinning=false;spins++;ballLanded=true;
        document.getElementById('sc').textContent=spins;
        document.getElementById('btn-spin').disabled=false;document.getElementById('btn-spin').textContent='GIRAR';
        draw(angle);drawBall(ballAngle,ballR);
        setTimeout(()=>showWinner(WINES[ws]),500);
      }
    }
  }
  requestAnimationFrame(frame);
}
function showWinner(w){
  const t=document.getElementById('w-type');
  t.textContent=w.type==='tinto'?'VINO TINTO':w.type==='champagne'?'CHAMPAGNE':'VINO BLANCO';
  t.className='winner-type '+w.type;
  document.getElementById('w-name').textContent=w.name+' '+w.vintage;
  document.getElementById('w-app').textContent=w.appellation;
  document.getElementById('w-price').textContent='$'+w.pvp;
  document.getElementById('w-tasting').textContent=w.tasting?'"'+w.tasting.substring(0,180)+'..."':'';
  document.getElementById('winner-modal').classList.add('open');
}
function waMsg(){
  const n=document.getElementById('w-name').textContent,p=document.getElementById('w-price').textContent;
  window.open('https://wa.me/584140297162?text='+encodeURIComponent('Hola! La ruleta de Vinopoly eligió el '+n+' a '+p+'. Me gustaría hacer un pedido 🍷'),'_blank');
}
</script>
