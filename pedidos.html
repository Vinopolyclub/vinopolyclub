<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINOPOLY CLUB — Mi Pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FDFAF4;font-family:'Montserrat',sans-serif;min-height:100vh}

/* Header */
.header{
  background:#1A0808;
  padding:16px 20px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.header-logo{
  font-family:'Playfair Display',serif;
  color:#C9A84C; font-size:1.1rem; letter-spacing:0.1em;
}
.header-sub{color:rgba(255,255,255,0.5);font-size:0.65rem;letter-spacing:0.2em;margin-top:2px}
.cart-summary{
  display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25);
  border-radius:20px; padding:6px 14px;
  color:#fff; font-size:13px; font-weight:600;
}

/* Section titles */
.section-title{
  background:#5C1A1A; color:#E8D5A3;
  padding:10px 16px; font-size:11px;
  letter-spacing:0.25em; font-weight:600;
}
.section-title.blanco{ background:#8B6B2A; }
.section-title.champagne{ background:#2A1A5C; }

/* Wine list */
.wine-row{
  display:flex; align-items:center; gap:12px;
  padding:10px 16px; border-bottom:1px solid rgba(201,168,76,0.12);
  background:#fff;
  transition:background 0.15s;
}
.wine-row:active{background:#faf6ee}
.wine-thumb{
  width:44px; height:70px; object-fit:contain;
  background:#F2F0EC; border-radius:4px;
  flex-shrink:0;
}
.wine-thumb-ph{
  width:44px; height:70px; background:#F2F0EC;
  border-radius:4px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.wine-info{flex:1; min-width:0}
.wine-name{
  font-size:12px; font-weight:600; color:#2d1a0a;
  line-height:1.3; margin-bottom:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.wine-appellation{font-size:10px;color:#8B6B2A;letter-spacing:0.05em}
.wine-price{font-size:13px;font-weight:700;color:#5C1A1A;flex-shrink:0}
.wine-controls{
  display:flex; align-items:center; gap:0;
  border:1.5px solid #C9A84C; border-radius:8px;
  overflow:hidden; height:32px; flex-shrink:0;
}
.wine-controls button{
  width:30px; height:32px; background:#f9f6f0;
  border:none; cursor:pointer; font-size:16px;
  font-weight:700; color:#5C1A1A;
}
.wine-controls button:active{background:#f0e8d5}
.wine-controls .qn{
  width:28px; text-align:center; font-size:13px;
  font-weight:700; color:#111;
  border-left:1px solid #C9A84C; border-right:1px solid #C9A84C;
  line-height:32px; background:#fff;
}

/* Cart footer */
.cart-footer{
  position:fixed; bottom:0; left:0; right:0;
  background:#1A0808; padding:16px 20px;
  display:none;
}
.cart-footer-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px;
}
.cart-footer-info{color:#C9A84C;font-size:13px}
.cart-footer-total{color:#fff;font-size:18px;font-weight:700}
#btn-wa{
  width:100%; padding:14px; background:#25D366; border:none;
  border-radius:24px; color:#fff; font-size:15px; font-weight:700;
  cursor:pointer; font-family:inherit;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
#btn-wa:active{background:#1ebe5d}
.spacer{height:100px}

/* Empty state */
.empty{
  text-align:center; padding:60px 20px; color:#8B6B2A;
}
.empty .ei{font-size:56px;margin-bottom:12px}
.empty p{font-size:13px;line-height:1.7;color:#666}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-logo">✦ VINOPOLY CLUB ✦</div>
    <div class="header-sub">SELECCIÓN DE VINOS FRANCESES 2026</div>
  </div>
  <div class="cart-summary">
    <span style="color:#fff;font-size:11px;letter-spacing:0.08em;margin-right:2px;">Para hacer tu pedido</span>
    <span style="font-size:20px;">&#128722;</span>
    <span id="hdr-count" style="color:#FFD814;font-weight:700;">0 bot.</span>
    <span id="hdr-total" style="color:#fff;font-weight:700;">$0</span>
  </div>
</div>

<div id="wine-list"></div>
<div class="spacer"></div>

<div class="cart-footer" id="cart-footer">
  <div class="cart-footer-row">
    <div class="cart-footer-info" id="ft-info">0 botellas seleccionadas</div>
    <div class="cart-footer-total" id="ft-total">$0</div>
  </div>
  <button id="btn-wa" onclick="sendOrder()">
    &#128242; Enviar pedido por WhatsApp
  </button>
</div>

// Load cart
var cart = {};
try { var s = localStorage.getItem(CART_KEY); if(s) cart = JSON.parse(s); } catch(e) {}

function saveCart() {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch(e) {}
}

function setQty(id, qty) {
  if(qty <= 0) delete cart[id];
  else {
    var w = WINES.find(function(x){return x.id===id;});
    if(w) cart[id] = {name:w.name, vintage:w.vintage, pvp:w.pvp, qty:qty};
  }
  saveCart();
  updateUI();
  document.getElementById('q'+id) && (document.getElementById('q'+id).textContent = qty > 0 ? qty : 0);
}

window.changeQty = function(id, d) {
  var cur = cart[id] ? cart[id].qty : 0;
  setQty(id, cur + d);
};

function updateUI() {
  var total = 0, bottles = 0;
  Object.values(cart).forEach(function(i) { total += i.qty * i.pvp; bottles += i.qty; });
  document.getElementById('hdr-count').textContent = bottles + ' bot.';
  document.getElementById('hdr-total').textContent = '$' + total.toLocaleString('es-VE');
  var footer = document.getElementById('cart-footer');
  footer.style.display = bottles > 0 ? 'block' : 'none';
  document.getElementById('ft-info').textContent = bottles + ' botella' + (bottles!==1?'s':'') + ' seleccionadas';
  document.getElementById('ft-total').textContent = '$' + total.toLocaleString('es-VE');
}

function sendOrder() {
  var keys = Object.keys(cart);
  if(!keys.length) { alert('Tu pedido está vacío.'); return; }
  var total=0, bottles=0, lines=['🍷 *VINOPOLY CLUB — Pedido*',''];
  keys.forEach(function(id) {
    var i=cart[id], sub=i.qty*i.pvp; total+=sub; bottles+=i.qty;
    lines.push(i.qty+' '+i.name+' '+i.vintage+' · $'+i.pvp+' = $'+sub);
  });
  lines.push('','──────────────────');
  lines.push('🧾 *Total: '+bottles+' botellas — $'+total.toLocaleString('es-VE')+'*');
  lines.push('','💳 Zelle: pbrillembourg@gmail.com');
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(lines.join('\n')),'_blank');
}

    if(w.region==='champagne') return 2;
    var RED=['bordeaux-rouge','margaux','saint-estephe','pessac','saint-emilion','medoc-castillon-fronsac','pomerol','other','loira-tinto','rhone-rouge','beaujolais','rhone','italy'];
    if(RED.indexOf(w.region)>=0 || w.id===34) return 0;
    return 1;
  }
  var html = '';
  cats.forEach(function(cat) {
    var group = WINES.filter(function(w){return getCat(w)===cat.key;});
    if(!group.length) return;
    html += '<div class="section-title '+cat.cls+'">'+cat.label+'</div>';
    group.forEach(function(w) {
      var cur = cart[w.id] ? cart[w.id].qty : 0;
      var thumb = THUMBS[w.id] ? '<img class="wine-thumb" src="'+THUMBS[w.id]+'" alt="">' : '<div class="wine-thumb-ph">🍷</div>';
      html += '<div class="wine-row">'+thumb+'<div class="wine-info"><div class="wine-name">'+w.name+' '+w.vintage+'</div><div class="wine-appellation">'+w.appellation+'</div></div><div class="wine-price">$'+w.pvp+'</div><div class="wine-controls"><button onclick="changeQty('+w.id+',-1)">&#8722;</button><span class="qn" id="q'+w.id+'">'+cur+'</span><button onclick="changeQty('+w.id+',1)">+</button></div></div>';
    });
  });
  document.getElementById('wine-list').innerHTML = html;
  updateUI();
}

render();
</script>
</body>
</html>
